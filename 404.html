<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Health Food Store</title>
    <script type="text/javascript">
      // 单页应用 404 处理
      var pathSegmentsToKeep = 1;

      var l = window.location;
      var pathname = l.pathname;

      // 移除重复的 /healthystore 前缀
      if (pathname.startsWith("/healthystore/healthystore")) {
        pathname = pathname.replace(
          "/healthystore/healthystore",
          "/healthystore"
        );
      }

      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>

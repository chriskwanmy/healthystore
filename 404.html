<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Health Food Store</title>
    <script type="text/javascript">
      // 单页应用 404 处理
      var pathSegmentsToKeep = 1;

      var l = window.location;
      var pathname = l.pathname;

      // 移除重复的 /healthystore 前缀
      if (pathname.startsWith("/healthystore/healthystore")) {
        pathname = pathname.replace(
          "/healthystore/healthystore",
          "/healthystore"
        );
      }

      // 直接重定向到 index.html，不添加查询参数
      window.location.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          "/healthystore/index.html"
      );
    </script>
  </head>
  <body></body>
</html>

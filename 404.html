<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Health Food Store</title>
    <script type="text/javascript">
      // 单页应用 404 处理
      var l = window.location;
      var pathname = l.pathname;

      // 确保路径以 /healthystore 开头
      if (!pathname.startsWith("/healthystore")) {
        pathname = "/healthystore" + pathname;
      }

      // 移除重复的 /healthystore 前缀
      if (pathname.startsWith("/healthystore/healthystore")) {
        pathname = pathname.replace(
          "/healthystore/healthystore",
          "/healthystore"
        );
      }

      // 保存原始路径
      sessionStorage.setItem("originalPath", pathname);

      // 重定向到 index.html
      window.location.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          "/healthystore/index.html"
      );
    </script>
  </head>
  <body></body>
</html>
